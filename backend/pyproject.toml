[project]
name = "cad-tp-backend"
version = "0.1.0"
description = "Локальный анализ КД и генерация технологической документации"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psutil>=6.1",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
